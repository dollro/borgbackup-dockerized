services:
  borgbackup:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: borgbackup
    # Container hostname drives borg's {hostname} placeholder in archive names
    # ('{hostname}-{now}') and prune ('--glob-archives {hostname}-*'). It must be
    # stable across runs (the Docker default is a random container ID). run-backup.sh
    # defaults BORG_HOSTNAME to the host's hostname; set BORG_HOSTNAME in .env to override.
    hostname: ${BORG_HOSTNAME:-borgbackup}
    stdin_open: true
    tty: true
    environment:
      # Storage Backend Selection
      # Options: "s3" | "usb" | "local"
      - BACKUP_STORAGE_TYPE=${BACKUP_STORAGE_TYPE:-s3}
      
      # Logging Configuration
      - LOGGING=${LOGGING:-INFO}
      
      # Progress Display (set to "true" to show real-time progress)
      - SHOW_PROGRESS=${SHOW_PROGRESS:-false}
      
      # Borg Configuration
      - BORG_REPO_PATH=${BORG_REPO_PATH:-borgbackup}
      - BORG_PASSPHRASE=${BORG_PASSPHRASE}
      # Stale lock handling: "false" | "manual" | "auto"
      - BORG_AUTO_BREAK_LOCK=${BORG_AUTO_BREAK_LOCK:-false}
      # Timeout (seconds) for borg create/prune operations
      - BORG_TIMEOUT=${BORG_TIMEOUT:-14400}
      # Space-separated source paths relative to host root (default "." = whole root)
      - BORG_SOURCE_PATHS=${BORG_SOURCE_PATHS:-.}

      # === S3 Configuration (when BACKUP_STORAGE_TYPE=s3) ===
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      
      # === USB Configuration (when BACKUP_STORAGE_TYPE=usb) ===
      - USB_DEVICE_UUID=${USB_DEVICE_UUID:-}
      
      # === Local Configuration (when BACKUP_STORAGE_TYPE=local) ===
      - LOCAL_BACKUP_PATH=${LOCAL_BACKUP_PATH:-}
    volumes:
      # Host filesystem (read-only backup source)
      - /:/mnt/target:ro
      # Writable paths for backup logs and pre-backup dumps
      - /backup/log:/mnt/target/backup/log
      - /backup/dump:/mnt/target/backup/dump

      # Persist borg's cache and security/config dir across `--rm` runs (host dirs).
      # Without this, every run rebuilds the chunks cache from the repo (slow + S3
      # GET costs); persisting it restores fast incremental syncs.
      - /var/cache/borgbackup:/root/.cache/borg
      - /var/lib/borgbackup:/root/.config/borg

      # Device access for FUSE mounts (S3) and block devices (USB)
      - /dev:/dev
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      
      # Local backup destination (bind mount from host)
      # For BACKUP_STORAGE_TYPE=local: set LOCAL_BACKUP_PATH in .env (required)
      # For S3/USB: this mount is overwritten by FUSE/device mount in entrypoint
      - ${LOCAL_BACKUP_PATH:-/tmp/backup}:/mnt/backup
    privileged: true
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          memory: 4G
