services:
  borgbackup:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: borgbackup
    stdin_open: true
    tty: true
    environment:
      # Storage Backend Selection
      # Options: "s3" | "usb" | "local"
      - BACKUP_STORAGE_TYPE=${BACKUP_STORAGE_TYPE:-s3}
      
      # Logging Configuration
      - LOGGING=${LOGGING:-INFO}
      
      # Progress Display (set to "true" to show real-time progress)
      - SHOW_PROGRESS=${SHOW_PROGRESS:-false}
      
      # Borg Configuration
      - BORG_REPO_PATH=${BORG_REPO_PATH:-borgbackup}
      - BORG_PASSPHRASE=${BORG_PASSPHRASE}
      
      # === S3 Configuration (when BACKUP_STORAGE_TYPE=s3) ===
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      
      # === USB Configuration (when BACKUP_STORAGE_TYPE=usb) ===
      - USB_DEVICE_UUID=${USB_DEVICE_UUID}
      
      # === Local Configuration (when BACKUP_STORAGE_TYPE=local) ===
      - LOCAL_BACKUP_PATH=${LOCAL_BACKUP_PATH}
    volumes:
      # Host filesystem access for backup source
      - /:/mnt/target
      
      # FUSE device (required for s3fs)
      - /dev/fuse:/dev/fuse
      # USB device detection (required for blkid UUID lookups)
      - /dev/disk:/dev/disk:ro
      # NOTE: For USB backend, you may also need to mount your specific
      # block device, e.g.: /dev/sdb1:/dev/sdb1
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      
      # Local backup destination (bind mount from host)
      # For BACKUP_STORAGE_TYPE=local: set LOCAL_BACKUP_PATH in .env (required)
      # For S3/USB: this mount is overwritten by FUSE/device mount in entrypoint
      - ${LOCAL_BACKUP_PATH:-/mnt/backup-unused}:/mnt/backup
    cap_add:
      - SYS_ADMIN
